spring:
  flyway:
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

imld:
  deployment:
    mode: saas
    tenant-mode: multi-tenant
  security:
    enabled: true
  community:
    scope: GLOBAL
    global-tenant-code: IMLD_COMMUNITY
  identity:
    verification:
      sms:
        enabled: false
        provider: real
  inference:
    imld:
      engine: xgboost-java
  cloud-bridge:
    enabled: false
  licensing:
    model: saas-subscription
    private-edition:
      startup-validation-enabled: false
  upgrade:
    check-enabled: true
    release-channel: stable
    entitlement:
      enforce-support-window: false
