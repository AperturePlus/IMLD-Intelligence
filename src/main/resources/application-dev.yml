spring:
  flyway:
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15432/imld_core?sslmode=disable&characterEncoding=utf8
    username: imld_user
    password: system
  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 20
    template:
      mandatory: true

imld:
  deployment:
    mode: develop
    tenant-mode: multi-tenant
  community:
    scope: GLOBAL
    global-tenant-code: IMLD_COMMUNITY
  cloud-bridge:
    enabled: false
  licensing:
    private-edition:
      startup-validation-enabled: false
      machine-binding-enabled: false
  upgrade:
    check-enabled: false
  security:
    public-paths:
      - /api/v1/app/toc/auth/dev/login
  identity:
    verification:
      sms:
        enabled: true
        provider: mock
  inference:
    imld:
      engine: mock
