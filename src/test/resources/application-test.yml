spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: false

mybatis:
  mapper-locations: classpath*:xenosoft/imldintelligence/module/**/internal/repository/*.xml
  type-handlers-package: xenosoft.imldintelligence.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

imld:
  security:
    enabled: false
    jwt:
      secret: test-jwt-secret-key-for-unit-tests-only-123456